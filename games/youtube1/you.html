<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Embed</title>
    <style>
        /* Remove default margins and scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Optional: black background during load */
        }

        /* Force the iframe to fill the entire viewport */
        #frameframeframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="frameframeframe" allowfullscreen="true" src="https://frogiesarcade.win/embed.html#https://youtube.com/" frameborder="0"></iframe>

</body>
</html>
